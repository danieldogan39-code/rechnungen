    <div class="bar">
      <div class="chips">${filters.map(([k, l]) => `<button data-filter="${k}" class="${state.filter === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <input class="search" type="search" placeholder="Suchen …" value="${esc(state.query)}" aria-label="Rechnungen durchsuchen">
    </div>
    ${list.length ? groupedByCustomer('inv', list.map(([i]) => i), i => `
      <button class="row" data-open-inv="${i.id}">
        <div class="row-main"><b>${esc(i.number || 'Entwurf')}</b>
          <small>${i.issue_date ? fmtDate(i.issue_date) : 'noch nicht ausgestellt'}${i.recurring_id ? ' · Abo' : ''}${i.imported ? ' · übernommen' : ''}${i.service_text ? ' · ' + esc(i.service_text) : ''}</small></div>
        <div class="row-side"><b>${eur(invTotal(i))}</b>${chip(i)}</div>
      </button>`, list => {
        const st = list.map(invStatus);
        const open = list.filter((_, n) => ['open', 'overdue'].includes(st[n].key)).reduce((a, i) => a + +i.gross, 0);
        const overdue = st.some(x => x.key === 'overdue'), drafts = st.filter(x => x.key === 'draft').length;
        const count = list.filter(i => i.kind === 'invoice' && i.status !== 'draft').length;
        const latest = list.find(i => i.issue_date);
        return {
          attention: open > 0 || drafts > 0,
          line: `${count} ${count === 1 ? 'Rechnung' : 'Rechnungen'}${latest ? ' · zuletzt ' + fmtDate(latest.issue_date) : ''}${drafts ? ` · ${drafts} ${drafts === 1 ? 'Entwurf' : 'Entwürfe'}` : ''}`,
          right: open > 0 ? `<b>${eur(open)}</b><span class="chip ${overdue ? 'bad' : 'warn'}">${overdue ? 'überfällig' : 'offen'}</span>` : drafts ? '<span class="chip blue">Entwurf</span>' : '<span class="chip ok">alles bezahlt</span>',
        };
      })
      : `<div class="empty"><b>${state.invoices.length ? 'Nichts gefunden' : 'Noch keine Rechnungen'}</b>${state.invoices.length ? 'Ändere den Filter oder die Suche.' : 'Leg mit dem Plus-Knopf deine erste Rechnung an.'}</div>`}
    <button class="btn fab" data-fab>+ Rechnung</button>`;
}
function wireInvoices() {
  $$('[data-filter]').forEach(b => b.onclick = () => { state.filter = b.dataset.filter; render(); });
  const s = $('.search');
  if (s) s.oninput = () => { state.query = s.value; const pos = s.selectionStart; render(); const n = $('.search'); n.focus(); n.setSelectionRange(pos, pos); };
  $$('[data-open-inv]').forEach(b => b.onclick = () => { const inv = invoiceById(b.dataset.openInv); inv.status === 'draft' ? invoiceEditor(inv) : invoiceDetail(inv); });
  wireGroups(cid => invoiceEditor(null, cid));
  $$('[data-year]').forEach(b => b.onclick = () => statsSheet(b.dataset.year));
}

// Positionen-Editor (für Rechnungen und Abos)
const UNITS = ['Std.', 'Stk.', 'pauschal', 'Monat', 'Tag', 'Seite'];
function itemRow(it = {}, withBilling = false) {
  const vat = small() ? 0 : (it.vat ?? 19);
  return `<div class="item">
    ${withBilling ? `<select class="i-bill" aria-label="Abrechnungsart">${Object.entries(BILLING).map(([k, l]) => `<option value="${k}" ${billingOf(it) === k ? 'selected' : ''}>${l}</option>`).join('')}</select>` : ''}
    <textarea class="i-desc" rows="2" placeholder="Bezeichnung (erste Zeile, fett)&#10;Details in weiteren Zeilen (optional)">${esc(it.description)}</textarea>
    <div class="item-nums ${small() ? 'no-vat' : ''}">
      <label>Menge<input class="i-qty" inputmode="decimal" value="${esc(fmtNum(it.quantity ?? 1, 3))}"></label>
      <label>Einheit<input class="i-unit" list="units" value="${esc(it.unit ?? 'Std.')}"></label>
      <label>Preis ${small() ? '' : 'netto '}€<input class="i-price" inputmode="decimal" value="${esc(it.price != null ? fmtNum(it.price) : '')}" placeholder="0,00"></label>
      <label>Rabatt %<input class="i-disc" inputmode="decimal" value="${esc(+it.discount ? fmtNum(it.discount, 3) : '')}" placeholder="0"></label>
      <label class="vat-col">USt<select class="i-vat">${[19, 7, 0].map(v => `<option value="${v}" ${+vat === v ? 'selected' : ''}>${v} %</option>`).join('')}</select></label>
      <button type="button" class="icon-btn del" data-del-item aria-label="Position entfernen">${ICON.close}</button>
    </div>
    <div class="item-foot"><button type="button" class="linkbtn tpl-save" data-save-tpl>☆ Als Vorlage speichern</button><span class="i-line"></span></div>
  </div>`;
}
function itemsEditor(items, withBilling = false) {
  return `<datalist id="units">${UNITS.map(u => `<option value="${u}">`).join('')}</datalist>
    <div class="items" data-billing="${withBilling ? 1 : 0}">${(items?.length ? items : [{}]).map(it => itemRow(it, withBilling)).join('')}</div>
    <div class="bar" style="margin-bottom:6px"><button type="button" class="btn sm" data-pick-tpl>+ Aus Vorlagen</button><button type="button" class="btn ghost sm" data-add-item>+ Leere Position</button></div>
    <div class="totals"></div>`;
}
function readItems(root) {
  return $$('.item', root).map(el => ({
    description: $('.i-desc', el).value.trim(), quantity: num($('.i-qty', el).value), unit: $('.i-unit', el).value.trim(),
    price: num($('.i-price', el).value), discount: num($('.i-disc', el).value), vat: small() ? 0 : +$('.i-vat', el).value,
    ...($('.i-bill', el) ? { billing: $('.i-bill', el).value } : {}),
  })).filter(it => it.description || it.price);
}
function wireItems(root) {
  const box = $('.items', root);
  const wb = box.dataset.billing === '1';
  const update = () => {
    $$('.item', root).forEach(el => { const l = lineNet({ quantity: num($('.i-qty', el).value), price: num($('.i-price', el).value), discount: num($('.i-disc', el).value) }); $('.i-line', el).textContent = l ? `= ${eur(l)}${small() ? '' : ' netto'}` : ''; });
    const t = totals(readItems(root));
    const groups = splitByBilling(readItems(root));
    if (wb && groups.some(g => g.billing !== 'once')) {
      $('.totals', root).innerHTML = groups.map(g => { const gt = totals(g.items); return `<div class="g"><span>${g.billing === 'once' ? 'Einmalig' : INTERVALS[g.billing][0].toUpperCase() + INTERVALS[g.billing].slice(1)}</span><span>${eur(gt.gross)}${BILL_SUFFIX[g.billing]}</span></div>`; }).join('') + (small() ? '<div><span>ohne USt (§ 19 UStG)</span><span></span></div>' : '<div><span>jeweils inkl. USt</span><span></span></div>');
      return;
    }
    $('.totals', root).innerHTML = small() ? `<div class="g"><span>Gesamt</span><span>${eur(t.gross)}</span></div><div><span>ohne USt (§ 19 UStG)</span><span></span></div>` : `<div><span>Netto</span><span>${eur(t.net)}</span></div>${t.vatLines.map(v => `<div><span>USt ${v.rate} %</span><span>${eur(v.amount)}</span></div>`).join('')}<div class="g"><span>Gesamt</span><span>${eur(t.gross)}</span></div>`;
  };
  const grow = ta => { ta.style.height = 'auto'; ta.style.height = Math.max(44, ta.scrollHeight + 2) + 'px'; };
  root.addEventListener('input', e => { if (e.target.closest('.item')) { if (e.target.matches('.i-desc')) grow(e.target); update(); } });
  root.addEventListener('change', e => { if (e.target.closest('.item')) update(); });
  $('[data-add-item]', root).onclick = () => { box.insertAdjacentHTML('beforeend', itemRow({ vat: $$('.i-vat', root).pop()?.value ?? 19 }, wb)); $$('.i-desc', root).pop().focus(); update(); };
  box.addEventListener('click', e => { const d = e.target.closest('[data-del-item]'); if (!d) return; d.closest('.item').remove(); if (!$('.item', root)) box.insertAdjacentHTML('beforeend', itemRow({}, wb)); update(); });
  $('[data-pick-tpl]', root).onclick = () => productPicker(p => {
    const it = productToItem(p);
    const rows = $$('.item', root);
    const last = rows[rows.length - 1];
    const emptyRow = last && !$('.i-desc', last).value.trim() && !num($('.i-price', last).value);
    if (!wb && billingOf(it) !== 'once') toast('Hinweis: Abo-Positionen rechnest du am besten über ein Abo oder ein Angebot ab.');
    if (emptyRow) last.outerHTML = itemRow(it, wb); else box.insertAdjacentHTML('beforeend', itemRow(it, wb));
    requestAnimationFrame(() => $$('.i-desc', root).forEach(grow));
    update(); toast(`„${p.name}“ hinzugefügt`);
  });
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-save-tpl]'); if (!b) return;
    const el = b.closest('.item');
    const raw = $('.i-desc', el).value.trim();
    if (!raw) { toast('Bitte zuerst eine Bezeichnung eintragen.', true); return; }
    const [name, ...rest] = raw.split('\n');
    const p = { name: name.trim(), details: rest.join('\n').trim() || null, unit: $('.i-unit', el).value.trim() || null, price: num($('.i-price', el).value), discount: num($('.i-disc', el).value), vat: small() ? 0 : +$('.i-vat', el).value, billing: $('.i-bill', el)?.value || 'once' };
    const dup = state.products.find(x => x.name.toLowerCase() === p.name.toLowerCase());
    run(b, async () => {
      if (dup && !confirm(`Es gibt schon eine Vorlage „${dup.name}“. Mit diesen Werten überschreiben?`)) return;
      const r = dup ? await db('products').update(p).eq('id', dup.id) : await db('products').insert(p);
      if (r.error) throw r.error;
      await reloadProducts(); toast(dup ? 'Vorlage aktualisiert' : 'Als Vorlage gespeichert');
    });
  });
  requestAnimationFrame(() => $$('.i-desc', root).forEach(grow));
  update();
}

const custOptions = sel => `<option value="">Kunde wählen …</option>` + state.customers.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}${c.number ? ' · ' + esc(c.number) : ''}${c.email ? '' : ' (ohne E-Mail)'}</option>`).join('');

function invoiceEditor(inv, presetCustomer = '') {
  const isNew = !inv;
  inv = inv || { items: [{ quantity: 1, unit: 'Std.', vat: 19 }], intro: S().intro, service_text: '', notes: '', customer_id: presetCustomer };
  const ref = inv.ref_invoice_id && invoiceById(inv.ref_invoice_id);
  const el = openSheet(isNew ? 'Neue Rechnung' : 'Rechnungsentwurf', `
    ${ref ? `<div class="note">Korrektur zu <b>${esc(ref.number)}</b>. Beim Versand bekommt der Kunde die Stornorechnung und diese neue Rechnung zusammen.</div>` : ''}
    <label>Kunde<div class="inline"><select name="customer_id">${custOptions(inv.customer_id)}</select><button type="button" class="btn ghost sm" data-x="newcust">+ Neu</button></div></label>
    <label>Leistungsdatum / -zeitraum<input name="service_text" value="${esc(inv.service_text)}" placeholder="z. B. Oktober 2026 oder 28.10.2026"></label>
    <label>Einleitungstext<textarea name="intro" rows="2">${esc(inv.intro)}</textarea></label>
    <h3 class="sub">Positionen</h3>
    ${itemsEditor(inv.items)}
    <label>Anmerkung (optional)<textarea name="notes" rows="2" placeholder="Erscheint unter den Summen">${esc(inv.notes)}</textarea></label>
    <div class="section" style="padding:14px 16px">
      <div class="grid2">
        <label>Rechnungsdatum<input name="issue_date" type="date" value="${todayISO()}" min="${HISTORY_START}" max="${todayISO()}"></label>
        <label class="check" style="margin-top:26px"><input type="checkbox" name="paid"> Bereits bezahlt</label>
      </div>
      <label data-paid-row hidden>Bezahlt am<input name="paid_at" type="date" value="${todayISO()}" min="${HISTORY_START}" max="${todayISO()}"></label>
      <p class="mini" data-backdate-hint hidden style="margin:0;color:var(--warn)">Rückdatieren nur für Rechnungen, die du an diesem Tag wirklich ausgestellt hast (z. B. Nachtrag aus dem alten System). Neue Rechnungen bekommen das heutige Datum – den Leistungszeitraum kannst du jederzeit in die Vergangenheit legen.</p>
    </div>
    <p class="mini">Die Rechnungsnummer wird beim Abschließen vergeben. Danach ist die Rechnung nicht mehr änderbar, nur noch per Korrektur.
    <br><button type="button" class="linkbtn" data-x="issueonly">Nur abschließen, ohne Versand</button></p>`,
    `${isNew ? '' : '<button class="btn ghost danger" data-x="del">Löschen</button>'}
     <button class="btn ghost" data-x="preview">Vorschau</button>
     <button class="btn ghost" data-x="save">Speichern</button>
     <button class="btn" data-x="issue">Abschließen &amp; senden</button>`);
  wireItems(el);
  let id = inv.id;
  const dateIn = $('[name=issue_date]', el), paidCb = $('[name=paid]', el), paidIn = $('[name=paid_at]', el);
  const syncDate = () => {
    const back = dateIn.value && dateIn.value < todayISO();
    $('[data-backdate-hint]', el).hidden = !back;
    $('[data-paid-row]', el).hidden = !paidCb.checked;
    paidIn.min = dateIn.value || HISTORY_START;
    // Nachträge (rückdatiert oder schon bezahlt) gehen standardmäßig NICHT per Mail raus
    late = !!(paidCb.checked || back);
    $('[data-x="issue"]', el).textContent = late ? 'Nachtragen' : 'Abschließen & senden';
    $('[data-x="issueonly"]', el).textContent = late ? 'Nachtragen und zusätzlich an den Kunden senden' : 'Nur abschließen, ohne Versand';
  };
  let late = false;
  dateIn.onchange = syncDate; paidCb.onchange = syncDate; syncDate();
  const collect = () => ({
    customer_id: $('[name=customer_id]', el).value || null, service_text: $('[name=service_text]', el).value.trim(),
    intro: $('[name=intro]', el).value.trim(), notes: $('[name=notes]', el).value.trim(), items: readItems(el),
  });
  const save = async () => {
    const d = collect();
    if (id) { const { error } = await db('invoices').update(d).eq('id', id); if (error) throw error; }
    else { const { data, error } = await db('invoices').insert({ ...d, status: 'draft', kind: 'invoice', ref_invoice_id: inv.ref_invoice_id || null }).select().single(); if (error) throw error; id = data.id; }
    return d;
  };
  const check = d => {
    if (!d.customer_id) throw new Error('Bitte einen Kunden wählen.');
    if (!d.items.length) throw new Error('Bitte mindestens eine Position eintragen.');
    if (!d.service_text) throw new Error('Bitte Leistungsdatum oder -zeitraum angeben (Pflichtangabe).');
  };
  const doIssue = async send => {
    const d = collect(); check(d);
    const c = customerById(d.customer_id);
    if (send && !c?.email) throw new Error('Der Kunde hat keine E-Mail-Adresse. Trag sie beim Kunden ein oder wähle „Nur abschließen“.');
    const issue_date = dateIn.value || todayISO();
    if (issue_date < HISTORY_START || issue_date > todayISO()) throw new Error('Das Rechnungsdatum muss zwischen 01.01.2024 und heute liegen.');
    const paid = paidCb.checked, paid_at = paidIn.value || issue_date;
    if (paid && paid_at < issue_date) throw new Error('Das Zahlungsdatum liegt vor dem Rechnungsdatum.');
    const what = `${issue_date < todayISO() ? ` mit Datum ${fmtDate(issue_date)}` : ''}${paid ? `, bezahlt am ${fmtDate(paid_at)}` : ''}`;
    if (!confirm(send ? `Rechnung${what} abschließen und an ${c.email} senden?` : `Rechnung${what} abschließen, ohne sie zu versenden?`)) return;
    await save();
    const r = await callAct('issue', { id, send, issue_date, paid, paid_at });
    closeSheet(el); await loadAll();
    toast(r.queued ? QUEUED_MSG : send ? `Rechnung ${r.invoice.number} an ${c.email} gesendet` : `Rechnung ${r.invoice.number} abgeschlossen`);
  };
  bind(el, 'save', async () => { await save(); closeSheet(el); await loadAll(); toast('Entwurf gespeichert'); });
  bind(el, 'preview', async () => { await save(); await openPdf({ id, kind: 'invoice' }); loadAll(); });
  bind(el, 'issue', () => doIssue(!late));
  bind(el, 'issueonly', () => doIssue(late));
  bind(el, 'del', async () => { if (!confirm('Entwurf löschen?')) return; const { error } = await db('invoices').delete().eq('id', id); if (error) throw error; closeSheet(el); await loadAll(); toast('Entwurf gelöscht'); });
  bind(el, 'newcust', () => customerEditor(null, c => { $('[name=customer_id]', el).innerHTML = custOptions(c.id); }));
}

function payDateSheet(inv) {
  const min = [inv.issue_date, HISTORY_START].filter(Boolean).sort().pop();
  const el = openSheet(`${inv.number} als bezahlt markieren`, `
    <p class="mini" style="margin:0 0 14px">${esc(custName(inv))} · ${eur(inv.gross)}</p>
    <label>Geld eingegangen am<input name="paid_at" type="date" value="${todayISO()}" min="${min}" max="${todayISO()}"></label>
    <p class="mini" style="margin:0">Das Datum zählt für deine Umsatzstatistik (Geldeingang).</p>`,
    `<button class="btn" data-x="ok">Als bezahlt markieren</button>`);
  bind(el, 'ok', async () => {
    const d = $('[name=paid_at]', el).value;
    if (!d || d < min || d > todayISO()) throw new Error('Bitte ein Datum zwischen Rechnungsdatum und heute wählen.');
    const { error } = await db('invoices').update({ status: 'paid', paid_at: new Date(d + 'T12:00:00Z').toISOString() }).eq('id', inv.id);
    if (error) throw error; closeSheet(el); await loadAll(); toast(`Bezahlt am ${fmtDate(d)}`);
  });
}

function invoiceDetail(inv) {
  const st = invStatus(inv);
  const ref = inv.ref_invoice_id && invoiceById(inv.ref_invoice_id);
  const storno = state.invoices.find(x => x.kind === 'storno' && x.ref_invoice_id === inv.id);
  const replacement = state.invoices.find(x => x.kind === 'invoice' && x.ref_invoice_id === inv.id);
  const logs = state.mail.filter(m => m.invoice_id === inv.id);
  const typeLabel = { invoice: 'Rechnung', correction: 'Korrektur', cancel: 'Storno', reminder: 'Zahlungserinnerung' };
  const isInv = inv.kind === 'invoice';
  const canAct = true;
  const rel = [];
  const fromQuote = state.quotes.find(q => q.invoice_id === inv.id);
  if (fromQuote) rel.push(`Aus Angebot <button class="linkbtn" data-goto-quote="${fromQuote.id}">${esc(fromQuote.number || 'Entwurf')}</button>`);
  if (ref) rel.push(`${inv.kind === 'storno' ? 'Storniert' : 'Ersetzt'} <button class="linkbtn" data-goto="${ref.id}">${esc(ref.number)}</button>`);
  if (storno) rel.push(`Storniert durch <button class="linkbtn" data-goto="${storno.id}">${esc(storno.number)}</button>`);
  if (replacement) rel.push(`Ersetzt durch <button class="linkbtn" data-goto="${replacement.id}">${esc(replacement.number || 'Entwurf')}</button>`);
  const el = openSheet(`${inv.kind === 'storno' ? 'Stornorechnung' : 'Rechnung'} ${inv.number}`, `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px"><span class="big">${eur(inv.gross)}</span>${chip(inv)}</div>
    <div class="mini" style="margin-bottom:14px">${esc(custName(inv))}${inv.customer?.email ? ' · ' + esc(inv.customer.email) : ''}</div>
    ${rel.length ? `<div class="note">${rel.join('<br>')}</div>` : ''}
    <dl class="kv">
      <dt>Rechnungsdatum</dt><dd>${fmtDate(inv.issue_date)}</dd>
      ${inv.service_text ? `<dt>Leistung</dt><dd>${esc(inv.service_text)}</dd>` : ''}
      ${isInv ? `<dt>Fällig am</dt><dd>${fmtDate(inv.due_date)}</dd>` : ''}
      <dt>Netto / USt</dt><dd>${eur(inv.net)} / ${eur(inv.vat)}</dd>
      <dt>Versendet</dt><dd>${inv.sent_at ? fmtDateTime(inv.sent_at) : 'noch nicht'}</dd>
      ${isInv && inv.reminders_sent ? `<dt>Erinnerungen</dt><dd>${inv.reminders_sent}, zuletzt ${fmtDate(inv.last_reminder_at)}</dd>` : ''}
      ${inv.paid_at ? `<dt>Bezahlt am</dt><dd>${fmtDate(String(inv.paid_at).slice(0, 10))}</dd>` : ''}
      ${inv.recurring_id ? `<dt>Herkunft</dt><dd>Abo</dd>` : ''}
      ${inv.imported ? `<dt>Herkunft</dt><dd>Übernommen aus dem alten System</dd>` : ''}
    </dl>
    <div class="actions">
      <button class="btn ghost" data-x="pdf">PDF ansehen / teilen</button>
      ${canAct && isInv && inv.status === 'open' ? '<button class="btn" data-x="paid">Als bezahlt markieren</button>' : ''}
      ${canAct && isInv && inv.status === 'paid' ? '<button class="btn ghost" data-x="unpaid">Doch nicht bezahlt</button>' : ''}
      ${canAct && isInv && inv.status === 'open' && st.key === 'overdue' ? '<button class="btn ghost" data-x="remind">Zahlungserinnerung jetzt senden</button>' : ''}
      ${canAct ? '<button class="btn ghost" data-x="resend">Erneut an Kunden senden</button>' : ''}
      ${canAct && isInv && ['open', 'paid'].includes(inv.status) ? '<button class="btn ghost" data-x="correct">Korrigieren (Storno + neue Rechnung)</button>' : ''}
      ${canAct && isInv && ['open', 'paid'].includes(inv.status) ? '<button class="btn ghost danger" data-x="cancel">Stornieren</button>' : ''}
    </div>
    <h3 class="sub">Positionen</h3>
    <ul class="mini">${(inv.items || []).map(it => `<li>${esc(fmtNum(it.quantity, 3))} ${esc(it.unit || '')} · ${esc(it.description)} · ${eur(r2(it.quantity * it.price))}</li>`).join('')}</ul>
    <h3 class="sub" style="margin-top:14px">E-Mail-Verlauf</h3>
    ${logs.length ? `<ul class="mini">${logs.map(m => `<li>${fmtDateTime(m.sent_at)} · ${typeLabel[m.type] || m.type} an ${esc(m.recipient)} ${m.status === 'sent' ? '✓' : `<span style="color:var(--bad)">fehlgeschlagen: ${esc(m.error)}</span>`}</li>`).join('')}</ul>` : '<p class="mini">Noch keine E-Mails.</p>'}
  `);
  $$('[data-goto]', el).forEach(b => b.onclick = () => { const t = invoiceById(b.dataset.goto); closeSheet(el); setTimeout(() => t.status === 'draft' ? invoiceEditor(t) : invoiceDetail(t), 220); });
  $$('[data-goto-quote]', el).forEach(b => b.onclick = () => { const q = quoteById(b.dataset.gotoQuote); closeSheet(el); setTimeout(() => quoteDetail(q), 220); });
  const after = async msg => { closeSheet(el); await loadAll(); if (msg) toast(msg); };
  bind(el, 'pdf', () => openPdf(inv));
  bind(el, 'paid', () => { closeSheet(el); setTimeout(() => payDateSheet(inv), 220); });
  bind(el, 'unpaid', async () => { const { error } = await db('invoices').update({ status: 'open', paid_at: null }).eq('id', inv.id); if (error) throw error; await after('Wieder als offen markiert'); });
  bind(el, 'remind', async () => { if (!confirm('Zahlungserinnerung jetzt an den Kunden senden?')) return; const r = await callAct('remind', { id: inv.id }); await after(r.queued ? QUEUED_MSG : `Erinnerung an ${r.to} gesendet`); });
  bind(el, 'resend', async () => { if (!confirm('Die Rechnung noch einmal an den Kunden senden?')) return; const r = await callAct('send', { id: inv.id }); await after(r.queued ? QUEUED_MSG : `An ${r.to} gesendet`); });
  bind(el, 'correct', async () => {
    if (!confirm(`Rechnung ${inv.number} korrigieren?\n\nSie wird storniert und als neuer Entwurf kopiert. Den Entwurf passt du an und schickst ihn ab. Der Kunde bekommt dann Storno und neue Rechnung zusammen.`)) return;
    needsNet('Korrigieren');
    const r = await callFn('correct', { id: inv.id, mode: 'replace' });
    closeSheet(el); await loadAll(); invoiceEditor(invoiceById(r.draft.id));
  });
  bind(el, 'cancel', async () => {
    if (!confirm(`Rechnung ${inv.number} stornieren?\n\nEs wird eine Stornorechnung erstellt und an den Kunden geschickt.`)) return;
    const r = await callAct('correct', { id: inv.id, mode: 'cancel' });
    await after(r.queued ? QUEUED_MSG : r.mailError ? `Storniert, aber Versand fehlgeschlagen: ${r.mailError}` : 'Storniert und Stornorechnung versendet');
  });
}

// ----- Statistik: Umsatz wie ein Kursverlauf -----
const MONTHS = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const MONTHS_LONG = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
// Geldeingänge: bezahlte Rechnungen, gezählt am Zahlungstag (ohne Datum: Rechnungsdatum)
function revenueEvents() {
  return state.invoices.filter(i => i.kind === 'invoice' && i.status === 'paid')
    .map(i => ({ inv: i, date: String(i.paid_at || i.issue_date || '').slice(0, 10), amount: +i.gross }))
    .filter(e => e.date >= HISTORY_START);
}
const yearsRange = () => { const y0 = 2024, y1 = +todayISO().slice(0, 4); return Array.from({ length: y1 - y0 + 1 }, (_, i) => y0 + i); };
// Umsatz je Monat (Index 0–11) für ein Jahr
function monthly(year, events = revenueEvents()) {
  const m = Array(12).fill(0);
  for (const e of events) if (e.date.startsWith(year + '-')) m[+e.date.slice(5, 7) - 1] += e.amount;
  return m.map(v => Math.round(v * 100) / 100);
}
const pct = (now, before) => before > 0 ? (now - before) / before * 100 : null;
const fmtPct = p => p === null ? '' : `${p >= 0 ? '▲' : '▼'} ${Math.abs(p).toLocaleString('de-DE', { maximumFractionDigits: 1 })} %`;

function yearTiles() {
  const ev = revenueEvents();
  const today = todayISO(), cy = +today.slice(0, 4), cm = +today.slice(5, 7);
  const tiles = yearsRange().reverse().map(y => {
    const m = monthly(y, ev), prev = monthly(y - 1, ev);
    const upto = y === cy ? cm : 12; // laufendes Jahr: gleicher Zeitraum im Vorjahr
    const sum = m.reduce((a, b) => a + b, 0), cmp = prev.slice(0, upto).reduce((a, b) => a + b, 0);
    const p = y > 2024 ? pct(sum, cmp) : null;
    return `<button class="ytile" data-year="${y}"><span class="ylabel">${y}${y === cy ? ' · lfd.' : ''}</span><b>${eur(sum)}</b><span class="ydelta ${p === null ? '' : p >= 0 ? 'up' : 'down'}">${p === null ? (y === 2024 ? 'Start' : '–') : fmtPct(p)}</span>${sparkline(m.slice(0, upto))}</button>`;
  }).join('');
  const total = ev.reduce((a, e) => a + e.amount, 0);
  return `<div class="ytiles"><button class="ytile all" data-year="all"><span class="ylabel">Gesamt seit 2024</span><b>${eur(total)}</b><span class="ydelta">Verlauf ansehen ›</span>${sparkline(cumSeries(ev).map(p => p.v))}</button>${tiles}</div>`;
}
function sparkline(vals) {
  if (vals.length < 2) return '<svg class="spark" viewBox="0 0 100 28"></svg>';
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 100).toFixed(1)},${(26 - (v - min) / (max - min || 1) * 24).toFixed(1)}`).join(' ');
  const up = vals[vals.length - 1] >= vals[0];
  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${up ? 'var(--ok)' : 'var(--accent)'}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
// kumulierte Monatsreihe seit 01/2024
function cumSeries(ev = revenueEvents()) {
  const out = []; let acc = 0;
  const today = todayISO(), cy = +today.slice(0, 4), cm = +today.slice(5, 7);
  for (const y of yearsRange()) { const m = monthly(y, ev); for (let i = 0; i < 12; i++) { if (y === cy && i >= cm) break; acc += m[i]; out.push({ label: `${MONTHS[i]} ${String(y).slice(2)}`, long: `${MONTHS_LONG[i]} ${y}`, v: acc, m: m[i] }); } }
  return out;
}

// Kurs-Chart (SVG) mit Fadenkreuz
function stockChart(series, compare) {
  const W = 640, H = 230, P = { l: 8, r: 8, t: 16, b: 26 };
  const all = series.map(p => p.v).concat(compare ? compare.map(p => p.v) : []);
  const max = Math.max(...all, 1) * 1.08, n = Math.max(series.length, compare?.length || 0, 2);
  const X = i => P.l + i / (n - 1) * (W - P.l - P.r), Y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  const path = s => s.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const up = series.length < 2 || series[series.length - 1].v >= (compare?.[series.length - 1]?.v ?? 0);
  const col = up ? 'var(--ok)' : 'var(--accent)';
  const area = series.length ? `${path(series)} L${X(series.length - 1).toFixed(1)},${H - P.b} L${X(0).toFixed(1)},${H - P.b} Z` : '';
  const step = Math.ceil(n / 12);
  const long = n > 13; // Gesamtverlauf: nur Jahresanfänge beschriften
  const ticks = (series.length >= (compare?.length || 0) ? series : compare).map((p, i) => (long ? p.label.startsWith('Jan') : (i % step === 0 || i === n - 1)) ? `<span style="left:${(X(i) / W * 100).toFixed(2)}%" class="${i === 0 ? 'first' : i === n - 1 ? 'last' : ''}">${long ? '20' + p.label.slice(-2) : p.label}</span>` : '').join('');
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(max / 1.08 * f)}" y2="${Y(max / 1.08 * f)}"/>`).join('');
  return `<div class="chart" data-n="${n}">
    <div class="chart-tip" hidden></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="chart-svg">
      <defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${up ? '#3DD68C' : '#FF5757'}" stop-opacity=".32"/><stop offset="1" stop-color="${up ? '#3DD68C' : '#FF5757'}" stop-opacity="0"/></linearGradient></defs>
      <g class="grid">${grid}</g>
      ${compare?.length ? `<path d="${path(compare)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke" opacity=".7"/>` : ''}
      ${area ? `<path d="${area}" fill="url(#cg)"/><path d="${path(series)}" fill="none" stroke="${col}" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
      <line class="cross" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" hidden/>
      <circle class="dot" r="4.5" fill="${col}" stroke="var(--bg)" stroke-width="2" hidden/>
    </svg><div class="ticks">${ticks}</div></div>`;
}
function wireChart(root, series, compare, fmtTip) {
  const box = $('.chart', root); if (!box || !series.length) return;
  const svg = $('svg', box), tip = $('.chart-tip', box), cross = $('.cross', svg), dot = $('.dot', svg);
  const W = 640, H = 230, P = { l: 8, r: 8, t: 16, b: 26 };
  const all = series.map(p => p.v).concat(compare ? compare.map(p => p.v) : []);
  const max = Math.max(...all, 1) * 1.08, n = +box.dataset.n;
  const show = ev => {
    const r = svg.getBoundingClientRect();
    const x = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * W;
    const i = Math.max(0, Math.min(series.length - 1, Math.round((x - P.l) / (W - P.l - P.r) * (n - 1))));
    const cx = P.l + i / (n - 1) * (W - P.l - P.r), cy = P.t + (1 - series[i].v / max) * (H - P.t - P.b);
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.hidden = false;
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.hidden = false;
    tip.innerHTML = fmtTip(i); tip.hidden = false;
    tip.style.left = Math.min(Math.max(cx / W * r.width, 70), r.width - 70) + 'px';
  };
  const hide = () => { cross.hidden = true; dot.hidden = true; tip.hidden = true; };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', hide);
  svg.addEventListener('touchmove', e => { show(e); e.preventDefault(); }, { passive: false });
}

function statsSheet(which) {
  const ev = revenueEvents();
  const today = todayISO(), cy = +today.slice(0, 4), cm = +today.slice(5, 7);
  const isAll = which === 'all';
  const y = isAll ? null : +which;
  const upto = isAll ? null : (y === cy ? cm : 12);
  let series, compare = null, total, cmpTotal = null, months, title;
  if (isAll) {
    series = cumSeries(ev); total = ev.reduce((a, e) => a + e.amount, 0); title = 'Umsatz seit 2024';
    months = series.map(p => ({ label: p.long, v: p.m })).reverse();
  } else {
    const m = monthly(y, ev), pm = monthly(y - 1, ev);
    let acc = 0; series = m.slice(0, upto).map((v, i) => ({ label: MONTHS[i], long: `${MONTHS_LONG[i]} ${y}`, v: (acc += v), m: v }));
    if (y > 2024) { let a2 = 0; compare = pm.map((v, i) => ({ label: MONTHS[i], long: `${MONTHS_LONG[i]} ${y - 1}`, v: (a2 += v), m: v })); }
    total = acc; cmpTotal = y > 2024 ? pm.slice(0, upto).reduce((a, b) => a + b, 0) : null;
    months = m.slice(0, upto).map((v, i) => ({ label: MONTHS_LONG[i], v, prev: y > 2024 ? pm[i] : null })).reverse();
    title = `Umsatz ${y}`;
  }
  const p = cmpTotal !== null ? pct(total, cmpTotal) : null;
  const inScope = e => isAll || e.date.startsWith(y + '-');
  const evs = ev.filter(inScope);
  const activeMonths = isAll ? Math.max(series.length, 1) : upto;
  const best = months.reduce((b, x) => (x.v > (b?.v ?? -1) ? x : b), null);
  const maxM = Math.max(...months.map(x => x.v), 1);
  // Quartale
  const quarters = isAll ? null : [0, 1, 2, 3].map(q => monthly(y, ev).slice(q * 3, q * 3 + 3).reduce((a, b) => a + b, 0));
  // Kunden
  const byCust = {}; for (const e of evs) { const k = e.inv.customer_id || 'none'; byCust[k] = (byCust[k] || 0) + e.amount; }
  const top = Object.entries(byCust).sort((a, b) => b[1] - a[1]).slice(0, 6);
  // offene Forderungen (Rechnungen dieses Zeitraums)
  const openInv = state.invoices.filter(i => i.kind === 'invoice' && i.status === 'open' && (isAll || String(i.issue_date).startsWith(y + '-')));
  const openSum = openInv.reduce((a, i) => a + +i.gross, 0);
  const firstDates = {}; for (const i of state.invoices.filter(i => i.kind === 'invoice' && ['open', 'paid'].includes(i.status) && i.issue_date)) { const k = i.customer_id; if (!firstDates[k] || i.issue_date < firstDates[k]) firstDates[k] = i.issue_date; }
  const newCust = isAll ? Object.keys(firstDates).length : Object.values(firstDates).filter(d => d.startsWith(y + '-')).length;
  const mrr = state.recurring.filter(r => r.active).reduce((a, r) => a + totals(r.items).gross / (STEP_M[r.interval] || 1), 0);
  const yearsBars = isAll ? yearsRange().map(yy => ({ label: String(yy), v: monthly(yy, ev).reduce((a, b) => a + b, 0) })).reverse() : null;
  const maxY = yearsBars ? Math.max(...yearsBars.map(x => x.v), 1) : 1;
  const el = openSheet(title, `
    <div class="chips st-years">${[...yearsRange().map(String), 'all'].map(k => `<button class="${String(which) === k ? 'on' : ''}" data-sy="${k}">${k === 'all' ? 'Alle' : k}</button>`).join('')}</div>
    <div class="st-head">
      <div class="big">${eur(total)}</div>
      ${p !== null ? `<span class="ydelta big-d ${p >= 0 ? 'up' : 'down'}">${fmtPct(p)} <small>ggü. ${y - 1}${y === cy ? ' (gleicher Zeitraum)' : ''}</small></span>` : `<span class="ydelta big-d"><small>${isAll ? `${evs.length} bezahlte Rechnungen` : y === 2024 ? 'Erstes Jahr' : ''}</small></span>`}
    </div>
    ${stockChart(series, compare)}
    ${compare ? `<div class="legend"><span><i style="background:var(--ok)"></i>${y}</span><span><i class="dash"></i>${y - 1}</span></div>` : ''}
    <div class="stats st-kpi">
      <div class="stat"><span>Ø pro Monat</span><b>${eur(total / activeMonths)}</b></div>
      <div class="stat"><span>Bester Monat</span><b>${best && best.v ? eur(best.v) : '–'}</b><small class="mini">${best && best.v ? esc(best.label) : ''}</small></div>
      <div class="stat"><span>Bezahlte Rechnungen</span><b>${evs.length}</b></div>
      <div class="stat ${openSum ? 'bad' : ''}"><span>Noch offen</span><b>${eur(openSum)}</b></div>
      <div class="stat"><span>${isAll ? 'Kunden' : 'Neue Kunden'}</span><b>${newCust}</b></div>
      <div class="stat"><span>Wiederkehrend / Monat</span><b>${eur(mrr)}</b></div>
    </div>
    ${quarters ? `<h3 class="sub">Quartale</h3><div class="stats st-q">${quarters.map((v, i) => `<div class="stat"><span>Q${i + 1}</span><b>${eur(v)}</b></div>`).join('')}</div>` : ''}
    ${yearsBars ? `<h3 class="sub">Jahre</h3><div class="mbars" style="margin-bottom:18px">${yearsBars.map((x, i) => { const prev = yearsBars[i + 1]; const pp = prev ? pct(x.v, +x.label === cy ? monthly(cy - 1, ev).slice(0, cm).reduce((a, b) => a + b, 0) : prev.v) : null; return `<button class="mbar as-btn" data-sy="${x.label}"><span class="ml">${x.label}${+x.label === cy ? ' (lfd.)' : ''}</span><span class="mt"><i style="width:${(x.v / maxY * 100).toFixed(1)}%"></i></span><b>${eur(x.v)}</b><small class="${pp === null ? '' : pp >= 0 ? 'up' : 'down'}">${pp === null ? '' : fmtPct(pp)}</small></button>`; }).join('')}</div>` : ''}
    <h3 class="sub">Monate</h3>
    <div class="mbars">${months.map(x => `<div class="mbar"><span class="ml">${esc(x.label)}</span><span class="mt"><i style="width:${(x.v / maxM * 100).toFixed(1)}%"></i></span><b>${eur(x.v)}</b>${x.prev !== null && x.prev !== undefined ? `<small class="${x.v >= x.prev ? 'up' : 'down'}">${x.prev ? fmtPct(pct(x.v, x.prev)) : ''}</small>` : ''}</div>`).join('') || '<p class="mini">Noch keine Umsätze.</p>'}</div>
    <h3 class="sub" style="margin-top:18px">Umsatz nach Kunden</h3>
    <div class="mbars">${top.map(([k, v]) => `<div class="mbar"><span class="ml">${esc(customerById(k)?.name || 'Ohne Kunde')}</span><span class="mt"><i style="width:${(v / (top[0][1] || 1) * 100).toFixed(1)}%;background:var(--info)"></i></span><b>${eur(v)}</b><small>${total ? Math.round(v / total * 100) + ' %' : ''}</small></div>`).join('') || '<p class="mini">Noch keine Umsätze.</p>'}</div>
    <p class="mini" style="margin-top:16px">Gezählt werden Geldeingänge: bezahlte Rechnungen am Zahlungstag (ohne Zahlungsdatum: am Rechnungsdatum). Ausgaben erfasst das Portal nicht – für eine vollständige Einnahmen-Überschuss-Rechnung brauchst du zusätzlich deine Belege.</p>`);
  el.querySelector('.sheet').classList.add('wide');
  $$('[data-sy]', el).forEach(b => b.onclick = () => { closeSheet(el); statsSheet(b.dataset.sy); });
  wireChart(el, series, compare, i => {
    const pnt = series[i]; const c = compare?.[i];
    return `<b>${esc(pnt.long)}</b><span>${eur(pnt.m)} im Monat</span><span>${eur(pnt.v)} kumuliert</span>${c ? `<span class="mini">${y - 1}: ${eur(c.v)}</span>` : ''}`;
  });
}

// ----- Angebote -----
const quoteById = id => state.quotes.find(q => q.id === id);
const quoteTotal = q => q.status === 'draft' ? totals(q.items).gross : +q.gross;
function quoteStatus(q) {
  if (q.status === 'draft') return { key: 'draft', label: 'Entwurf', cls: 'blue' };
  if (q.status === 'accepted') return { key: 'accepted', label: (q.invoice_id || state.recurring.some(r => r.quote_id === q.id)) ? 'Angenommen · umgesetzt' : 'Angenommen', cls: 'ok' };
  if (q.status === 'declined') return { key: 'declined', label: 'Abgelehnt', cls: 'grey' };
  if (q.valid_until && q.valid_until < todayISO()) return { key: 'expired', label: 'Abgelaufen', cls: 'grey' };
  return { key: 'open', label: 'Offen', cls: 'warn' };
}
const qchip = q => { const s = quoteStatus(q); return `${pendChip(q.id)}<span class="chip ${s.cls}">${esc(s.label)}</span>`; };

function viewQuotes() {
  const all = state.quotes.map(q => [q, quoteStatus(q)]);
  const sum = keys => all.filter(([, s]) => keys.includes(s.key)).reduce((a, [q]) => a + quoteTotal(q), 0);
  const cnt = keys => all.filter(([, s]) => keys.includes(s.key)).length;
  const decided = cnt(['accepted']) + cnt(['declined']);
  const rate = decided ? Math.round(cnt(['accepted']) / decided * 100) : null;
  const filters = [['all', 'Alle'], ['draft', 'Entwürfe'], ['open', 'Offen'], ['accepted', 'Angenommen'], ['declined', 'Abgelehnt'], ['expired', 'Abgelaufen']];
  const q = state.query.trim().toLowerCase();
  const list = all.filter(([x, st]) => (state.qfilter === 'all' || st.key === state.qfilter) &&
    (!q || `${x.number || ''} ${x.customer?.name || customerById(x.customer_id)?.name || ''} ${customerById(x.customer_id)?.number || ''} ${x.service_text || ''}`.toLowerCase().includes(q)));
  const open = cnt(['open']);
  return `${pageHead('Angebote', open ? `${open} ${open === 1 ? 'Angebot wartet' : 'Angebote warten'} auf Antwort · ${eur(sum(['open']))}` : 'Schreib ein Angebot – mit einem Tipp wird daraus später die Rechnung.')}
    <div class="stats">
      <div class="stat"><span>Offen</span><b>${eur(sum(['open']))}</b></div>
      <div class="stat"><span>Angenommen</span><b>${eur(sum(['accepted']))}</b></div>
      <div class="stat"><span>Zusagequote</span><b>${rate === null ? '–' : rate + ' %'}</b></div>
    </div>
    <div class="bar">
      <div class="chips">${filters.map(([k, l]) => `<button data-qfilter="${k}" class="${state.qfilter === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <input class="search" type="search" placeholder="Suchen …" value="${esc(state.query)}" aria-label="Angebote durchsuchen">
    </div>
    ${list.length ? groupedByCustomer('quo', list.map(([x]) => x), x => `
      <button class="row" data-open-quote="${x.id}">
        <div class="row-main"><b>${esc(x.number || 'Entwurf')}</b>
          <small>${x.issue_date ? fmtDate(x.issue_date) : 'noch nicht verschickt'}${x.valid_until && x.status === 'sent' ? ' · gültig bis ' + fmtDate(x.valid_until) : ''}${x.service_text ? ' · ' + esc(x.service_text) : ''}</small></div>
        <div class="row-side"><b>${splitText(x.items)}</b>${qchip(x)}</div>
      </button>`, list => {
        const st = list.map(quoteStatus);
        const open = st.filter(x => x.key === 'open').length, drafts = st.filter(x => x.key === 'draft').length, acc = st.filter(x => x.key === 'accepted').length;
        return {
          attention: open > 0 || drafts > 0,
          line: `${list.length} ${list.length === 1 ? 'Angebot' : 'Angebote'}${acc ? ` · ${acc} angenommen` : ''}${drafts ? ` · ${drafts} ${drafts === 1 ? 'Entwurf' : 'Entwürfe'}` : ''}`,
          right: open ? `<span class="chip warn">${open} offen</span>` : drafts ? '<span class="chip blue">Entwurf</span>' : acc ? '<span class="chip ok">angenommen</span>' : '<span class="chip grey">abgeschlossen</span>',
        };
      })
      : `<div class="empty"><b>${state.quotes.length ? 'Nichts gefunden' : 'Noch keine Angebote'}</b>${state.quotes.length ? 'Ändere den Filter oder die Suche.' : 'Leg mit dem Plus-Knopf dein erstes Angebot an.'}</div>`}
    <button class="btn fab" data-fab>+ Angebot</button>`;
}
function wireQuotes() {
  $$('[data-qfilter]').forEach(b => b.onclick = () => { state.qfilter = b.dataset.qfilter; render(); });
  const s = $('.search');
  if (s) s.oninput = () => { state.query = s.value; const pos = s.selectionStart; render(); const n = $('.search'); n.focus(); n.setSelectionRange(pos, pos); };
  $$('[data-open-quote]').forEach(b => b.onclick = () => { const q = quoteById(b.dataset.openQuote); q.status === 'draft' ? quoteEditor(q) : quoteDetail(q); });
  wireGroups(cid => quoteEditor(null, cid));
}

function quoteEditor(q, presetCustomer = '') {
  const isNew = !q;
  q = q || { items: [{ quantity: 1, unit: 'pauschal', vat: 19 }], intro: S().quote_intro, service_text: '', notes: '', customer_id: presetCustomer, status: 'draft' };
  const sent = q.status === 'sent';
  const el = openSheet(isNew ? 'Neues Angebot' : sent ? `Angebot ${q.number} bearbeiten` : 'Angebotsentwurf', `
    ${sent ? '<div class="note">Das Angebot wurde schon verschickt. Nach dem Speichern kannst du die neue Fassung direkt erneut senden – die Nummer bleibt gleich.</div>' : ''}
    <label>Kunde<div class="inline"><select name="customer_id">${custOptions(q.customer_id)}</select><button type="button" class="btn ghost sm" data-x="newcust">+ Neu</button></div></label>
    <div class="grid2">
      <label>Leistungszeitraum (optional)<input name="service_text" value="${esc(q.service_text)}" placeholder="z. B. ab Dezember 2026"></label>
      <label>Gültig bis<input name="valid_until" type="date" value="${esc(q.valid_until || '')}"></label>
      ${q.number ? '' : `<label>Angebotsdatum<input name="q_issue_date" type="date" value="${todayISO()}" min="${HISTORY_START}" max="${todayISO()}"></label>`}
    </div>
    <p class="mini" style="margin:-6px 0 14px">Leer lassen = ${esc(S().quote_valid_days)} Tage ab Versand.</p>
    <label>Einleitungstext<textarea name="intro" rows="2">${esc(q.intro)}</textarea></label>
    <h3 class="sub">Positionen</h3>
    <p class="mini" style="margin:-4px 0 12px">Pro Position wählst du „Einmalig“ oder „Abo“. Nimmt der Kunde an, wird aus Einmaligem eine Rechnung und aus Abo-Positionen ein Abo.</p>
    ${itemsEditor(q.items, true)}
    <label>Anmerkung (optional)<textarea name="notes" rows="2" placeholder="Erscheint unter der Angebotssumme">${esc(q.notes)}</textarea></label>
    ${sent ? '' : '<p class="mini"><button type="button" class="linkbtn" data-x="issueonly">Nur abschließen, ohne Versand</button></p>'}`,
    `${q.status === 'draft' && !isNew ? '<button class="btn ghost danger" data-x="del">Löschen</button>' : ''}
     <button class="btn ghost" data-x="preview">Vorschau</button>
     <button class="btn ghost" data-x="save">Speichern</button>
     <button class="btn" data-x="send">${sent ? 'Speichern &amp; erneut senden' : 'Abschließen &amp; senden'}</button>`);
  wireItems(el);
  let id = q.id;
  const collect = () => ({
    customer_id: $('[name=customer_id]', el).value || null, service_text: $('[name=service_text]', el).value.trim() || null,
    valid_until: $('[name=valid_until]', el).value || null,
    intro: $('[name=intro]', el).value.trim(), notes: $('[name=notes]', el).value.trim(), items: readItems(el),
  });
  const withTotals = d => { const t = totals(d.items); return { ...d, net: t.net, vat: t.vat, gross: t.gross }; };
  const save = async () => {
    const d = withTotals(collect());
    if (id) { const { error } = await db('quotes').update(d).eq('id', id); if (error) throw error; }
    else { const { data, error } = await db('quotes').insert({ ...d, status: 'draft' }).select().single(); if (error) throw error; id = data.id; }
    return d;
  };
  const doIssue = async send => {
    const d = collect();
    if (!d.customer_id) throw new Error('Bitte einen Kunden wählen.');
    if (!d.items.length) throw new Error('Bitte mindestens eine Position eintragen.');
    const c = customerById(d.customer_id);
    if (send && !c?.email) throw new Error('Der Kunde hat keine E-Mail-Adresse. Trag sie beim Kunden ein oder wähle „Nur abschließen“.');
    if (!confirm(send ? `Angebot ${sent ? 'erneut ' : ''}an ${c.email} senden?` : 'Angebot abschließen, ohne es zu versenden?')) return;
    await save();
    const r = await callAct('quote_issue', { id, send, issue_date: $('[name=q_issue_date]', el)?.value || todayISO() });
    closeSheet(el); await loadAll();
    toast(r.queued ? QUEUED_MSG : send ? `Angebot ${r.quote.number} an ${c.email} gesendet` : `Angebot ${r.quote.number} abgeschlossen`);
  };
  bind(el, 'save', async () => { await save(); closeSheet(el); await loadAll(); toast('Angebot gespeichert'); });
  bind(el, 'preview', async () => { await save(); await openPdf({ id, kind: 'quote', number: q.number }); loadAll(); });
  bind(el, 'send', () => doIssue(true));
  bind(el, 'issueonly', () => doIssue(false));
  bind(el, 'del', async () => { if (!confirm('Angebotsentwurf löschen?')) return; const { error } = await db('quotes').delete().eq('id', id); if (error) throw error; closeSheet(el); await loadAll(); toast('Entwurf gelöscht'); });
  bind(el, 'newcust', () => customerEditor(null, c => { $('[name=customer_id]', el).innerHTML = custOptions(c.id); }));
}

// Angenommenes Angebot umsetzen: Einmaliges → Rechnungsentwurf, Abo-Positionen → Abo(s)
function quoteAcceptSheet(q, onDone) {
  const groups = splitByBilling(q.items);
  const once = groups.find(g => g.billing === 'once');
  const subs = groups.filter(g => g.billing !== 'once');
  const start = firstOfNextMonth();
  const el = openSheet(`Angebot ${q.number} umsetzen`, `
    <p class="mini" style="margin:0 0 14px">Der Kunde hat zugesagt? Dann lege ich das an:</p>
    ${once ? `<div class="section"><h3>Rechnungsentwurf</h3><p class="hint" style="margin:0">Einmalige Positionen über <b>${eur(totals(once.items).gross)}</b> (${once.items.length} ${once.items.length === 1 ? 'Position' : 'Positionen'}). Du prüfst den Entwurf und schickst ihn ab.</p></div>` : ''}
    ${subs.map(g => `<div class="section"><h3>Abo · ${INTERVALS[g.billing]}</h3>
      <p class="hint">${eur(totals(g.items).gross)}${BILL_SUFFIX[g.billing]} · ${g.items.map(it => esc(String(it.description || '').split('\n')[0])).join(', ')}</p>
      <label>Erste Abo-Rechnung am<input type="date" data-start="${g.billing}" value="${start}"></label>
      <label class="check" style="margin:0"><input type="checkbox" data-auto="${g.billing}" checked>Automatisch an den Kunden senden</label></div>`).join('')}`,
    `<button class="btn" data-x="go">Angebot annehmen &amp; anlegen</button>`);
  bind(el, 'go', async () => {
    const res = { invoice: null, abos: 0 };
    if (once) {
      const { data, error } = await db('invoices').insert({
        status: 'draft', kind: 'invoice', customer_id: q.customer_id, items: once.items.map(({ billing, ...it }) => it),
        service_text: q.service_text || '', intro: S().intro, notes: q.notes || '',
      }).select().single();
      if (error) throw error; res.invoice = data;
    }
    for (const g of subs) {
      const d = $(`[data-start="${g.billing}"]`, el).value;
      if (!d) throw new Error('Bitte ein Startdatum für das Abo wählen.');
      const { error } = await db('recurring').insert({
        customer_id: q.customer_id, title: `${String(g.items[0].description || '').split('\n')[0]}${g.items.length > 1 ? ` + ${g.items.length - 1} weitere` : ''}`,
        items: g.items.map(({ billing, ...it }) => it), interval: g.billing, next_date: d,
        auto_send: $(`[data-auto="${g.billing}"]`, el).checked, active: true, quote_id: q.id,
      });
      if (error) throw error; res.abos++;
    }
    const { error: e2 } = await db('quotes').update({ status: 'accepted', invoice_id: res.invoice?.id || null, decided_at: q.decided_at || new Date().toISOString() }).eq('id', q.id);
    if (e2) throw e2;
    closeSheet(el); await loadAll();
    onDone?.(res);
  });
}

function quoteDetail(q) {
  const st = quoteStatus(q);
  const logs = state.mail.filter(m => m.quote_id === q.id);
  const inv = q.invoice_id && invoiceById(q.invoice_id);
  const abos = state.recurring.filter(r => r.quote_id === q.id);
  const done = inv || abos.length;
  const canAct = true;
  const el = openSheet(`Angebot ${q.number}`, `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px"><span class="big" style="font-size:${splitByBilling(q.items).length > 1 ? 28 : 38}px">${splitText(q.items)}</span>${qchip(q)}</div>
    <div class="mini" style="margin-bottom:14px">${esc(q.customer?.name || customerById(q.customer_id)?.name || '')}${q.customer?.email ? ' · ' + esc(q.customer.email) : ''}</div>
    ${done ? `<div class="note">${inv ? `Einmaliges berechnet mit <button class="linkbtn" data-goto-inv="${inv.id}">${esc(inv.number || 'Rechnungsentwurf')}</button>` : ''}${inv && abos.length ? '<br>' : ''}${abos.map(r => `Abo ${INTERVALS[r.interval]} · nächste Rechnung ${fmtDate(r.next_date)} <button class="linkbtn" data-goto-rec="${r.id}">öffnen</button>`).join('<br>')}</div>` : ''}
    <dl class="kv">
      <dt>Angebotsdatum</dt><dd>${fmtDate(q.issue_date)}</dd>
      <dt>Gültig bis</dt><dd>${fmtDate(q.valid_until)}</dd>
      ${q.service_text ? `<dt>Leistung</dt><dd>${esc(q.service_text)}</dd>` : ''}
      <dt>Versendet</dt><dd>${q.sent_at ? fmtDateTime(q.sent_at) : 'noch nicht'}</dd>
      ${q.decided_at ? `<dt>${q.status === 'declined' ? 'Abgelehnt am' : 'Angenommen am'}</dt><dd>${fmtDate(String(q.decided_at).slice(0, 10))}</dd>` : ''}
    </dl>
    <div class="actions">
      <button class="btn ghost" data-x="pdf">PDF ansehen / teilen</button>
      ${canAct && !done && q.status !== 'declined' ? `<button class="btn" data-x="invoice">${splitByBilling(q.items).some(g => g.billing !== 'once') ? 'Angenommen – Rechnung &amp; Abo anlegen' : 'Angenommen – in Rechnung umwandeln'}</button>` : ''}
      ${canAct && q.status === 'sent' ? '<button class="btn ghost" data-x="accept">Nur als angenommen markieren</button>' : ''}
      ${canAct && q.status === 'sent' ? '<button class="btn ghost" data-x="edit">Bearbeiten</button>' : ''}
      ${canAct && ['sent', 'accepted'].includes(q.status) ? '<button class="btn ghost" data-x="resend">Erneut an Kunden senden</button>' : ''}
      ${canAct && q.status === 'sent' ? '<button class="btn ghost danger" data-x="decline">Als abgelehnt markieren</button>' : ''}
      ${canAct && ['accepted', 'declined'].includes(q.status) && !done ? '<button class="btn ghost" data-x="reopen">Wieder auf offen setzen</button>' : ''}
    </div>
    <h3 class="sub">Positionen</h3>
    <ul class="mini">${(q.items || []).map(it => `<li>${esc(fmtNum(it.quantity, 3))} ${esc(it.unit || '')} · ${esc(String(it.description || '').split('\n')[0])} · ${eur(lineNet(it))}${BILL_SUFFIX[billingOf(it)]}</li>`).join('')}</ul>
    <h3 class="sub" style="margin-top:14px">E-Mail-Verlauf</h3>
    ${logs.length ? `<ul class="mini">${logs.map(m => `<li>${fmtDateTime(m.sent_at)} · an ${esc(m.recipient)} ${m.status === 'sent' ? '✓' : `<span style="color:var(--bad)">fehlgeschlagen: ${esc(m.error)}</span>`}</li>`).join('')}</ul>` : '<p class="mini">Noch keine E-Mails.</p>'}`);
  $$('[data-goto-inv]', el).forEach(b => b.onclick = () => { const t = invoiceById(b.dataset.gotoInv); closeSheet(el); setTimeout(() => t.status === 'draft' ? invoiceEditor(t) : invoiceDetail(t), 220); });
  const setStatus = async (status, msg) => {
    const { error } = await db('quotes').update({ status, decided_at: status === 'sent' ? null : new Date().toISOString() }).eq('id', q.id);
    if (error) throw error; closeSheet(el); await loadAll(); toast(msg);
  };
  bind(el, 'pdf', () => openPdf({ ...q, kind: 'quote' }));
  $$('[data-goto-rec]', el).forEach(b => b.onclick = () => { const r = state.recurring.find(x => x.id === b.dataset.gotoRec); closeSheet(el); state.tab = 'recurring'; render(); setTimeout(() => recurringEditor(r), 220); });
  bind(el, 'invoice', () => { closeSheet(el); setTimeout(() => quoteAcceptSheet(q, res => {
    if (res.invoice) { state.tab = 'invoices'; render(); invoiceEditor(invoiceById(res.invoice.id)); }
    else { state.tab = 'recurring'; render(); }
    toast(res.invoice && res.abos ? `Rechnungsentwurf und ${res.abos === 1 ? 'Abo' : res.abos + ' Abos'} angelegt` : res.invoice ? 'Rechnungsentwurf angelegt – prüfen und abschicken' : `${res.abos === 1 ? 'Abo' : res.abos + ' Abos'} angelegt`);
  }), 220); });
  bind(el, 'accept', () => setStatus('accepted', 'Als angenommen markiert'));
  bind(el, 'decline', () => setStatus('declined', 'Als abgelehnt markiert'));
  bind(el, 'reopen', () => setStatus('sent', 'Wieder offen'));
  bind(el, 'edit', () => { closeSheet(el); setTimeout(() => quoteEditor(q), 220); });
  bind(el, 'resend', async () => { if (!confirm('Das Angebot noch einmal an den Kunden senden?')) return; const r = await callAct('quote_send', { id: q.id }); closeSheet(el); await loadAll(); toast(r.queued ? QUEUED_MSG : `An ${r.to} gesendet`); });
}

// ----- Kunden -----
function viewCustomers() {
  const list = state.customers;
  return `${pageHead('Kunden', `${list.length} ${list.length === 1 ? 'Kunde' : 'Kunden'}`)}${list.length ? `<div class="list">${list.map(c => {
      const open = state.invoices.filter(i => i.customer_id === c.id && ['open', 'overdue'].includes(invStatus(i).key)).reduce((a, i) => a + +i.gross, 0);
      return `<button class="row" data-open-cust="${c.id}"><div class="row-main"><b>${esc(c.name)}</b><small>${esc([c.number && 'Nr. ' + c.number, c.contact, c.email || 'keine E-Mail', c.city].filter(Boolean).join(' · '))}</small></div>
        <div class="row-side">${open ? `<b>${eur(open)}</b><span class="chip warn">offen</span>` : ''}</div></button>`;

    <button class="btn fab" data-fab>+ Kunde</button>`;

function nextCustomerNumber() {
  const nums = state.customers.map(c => parseInt(c.number, 10)).filter(n => isFinite(n));
  return String(nums.length ? Math.max(...nums) + 1 : 10001);
}

function customerInvoiceNumber(c, n) {
  const s = S(); const p = String(s.prefix || ''); const sep = p && !/[-_/]$/.test(p) ? '-' : '';
  return `${p}${sep}${c.number || 'Kundennr.'}-${String(n).padStart(+s.number_digits || 4, '0')}`;
}
// Rechnungsverzeichnis eines Kunden
function customerDirectory(c) {
  const list = state.invoices.filter(i => i.customer_id === c.id).sort((a, b) => String(b.issue_date || '9999').localeCompare(String(a.issue_date || '9999')) || String(b.number || '').localeCompare(String(a.number || '')));
  const real = list.filter(i => i.kind === 'invoice' && ['open', 'paid'].includes(i.status));
  const paid = real.filter(i => i.status === 'paid').reduce((a, i) => a + +i.gross, 0);
  const open = real.filter(i => i.status === 'open').reduce((a, i) => a + +i.gross, 0);
  return `<h3 class="sub" style="margin-top:6px">Rechnungsverzeichnis</h3>
    <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
      <div class="stat"><span>Rechnungen</span><b>${real.length}</b></div>
      <div class="stat"><span>Bezahlt</span><b>${eur(paid)}</b></div>
      <div class="stat ${open ? 'bad' : ''}"><span>Offen</span><b>${eur(open)}</b></div>
    </div>
    ${list.length ? `<div class="list" style="margin-bottom:16px">${list.map(i => `<button class="row" data-dir-inv="${i.id}"><div class="row-main"><b>${esc(i.number || 'Entwurf')}</b><small>${i.issue_date ? fmtDate(i.issue_date) : 'noch nicht ausgestellt'}${i.service_text ? ' · ' + esc(i.service_text) : ''}${i.imported ? ' · übernommen' : ''}</small></div><div class="row-side"><b>${eur(invTotal(i))}</b>${chip(i)}</div></button>`).join('')}</div>` : '<p class="mini" style="margin:0 0 16px">Noch keine Rechnungen für diesen Kunden.</p>'}`;
}

function customerEditor(c, onSaved) {
  const isNew = !c; c = c || { country: 'Deutschland' };
  const el = openSheet(isNew ? 'Neuer Kunde' : (c.number ? c.number + ' · ' : '') + c.name, `
    <div class="grid3"><label>Kundennr.<input name="number" value="${esc(c.number ?? (isNew ? nextCustomerNumber() : ''))}"></label><label>Firma oder Name<input name="name" value="${esc(c.name)}" required></label></div>
    <label>Ansprechpartner (für die Anrede)<input name="contact" value="${esc(c.contact)}" placeholder="z. B. Frau Schulz"></label>
    <label>E-Mail für Rechnungen<input name="email" type="email" inputmode="email" value="${esc(c.email)}"></label>
    <label>Straße und Hausnummer<input name="street" value="${esc(c.street)}"></label>
    <div class="grid3"><label>PLZ<input name="zip" inputmode="numeric" value="${esc(c.zip)}"></label><label>Ort<input name="city" value="${esc(c.city)}"></label></div>
    <div class="grid2"><label>Land<input name="country" value="${esc(c.country)}"></label><label>USt-IdNr. (optional)<input name="vat_id" value="${esc(c.vat_id)}"></label></div>
    ${isOn(S().number_per_customer) ? `<label>Rechnungen fortsetzen ab Nr.<input name="invoice_start" inputmode="numeric" value="${esc(c.invoice_start ?? 1)}"></label>
      <p class="mini" style="margin:-8px 0 16px">${+c.invoice_counter ? `Zuletzt vergeben: ${esc(customerInvoiceNumber(c, c.invoice_counter))} · ` : ''}Nächste Rechnung: <b>${esc(customerInvoiceNumber(c, Math.max((+c.invoice_counter || 0) + 1, +c.invoice_start || 1)))}</b></p>` : ''}
    ${isNew ? '' : customerDirectory(c)}`,
    `${isNew ? '' : '<button class="btn ghost danger" data-x="del">Löschen</button>'}<button class="btn" data-x="save">Speichern</button>`);
  const read = () => {
    const d = Object.fromEntries(['number', 'name', 'contact', 'email', 'street', 'zip', 'city', 'country', 'vat_id'].map(k => [k, $(`[name=${k}]`, el).value.trim() || null]));
    const st = $('[name=invoice_start]', el); if (st) d.invoice_start = Math.max(1, parseInt(st.value, 10) || 1);
    return d;
  };
  $$('[data-dir-inv]', el).forEach(b => b.onclick = () => { const t = invoiceById(b.dataset.dirInv); closeSheet(el); setTimeout(() => t.status === 'draft' ? invoiceEditor(t) : invoiceDetail(t), 220); });
  bind(el, 'save', async () => {
    const d = read(); if (!d.name) throw new Error('Bitte einen Namen eintragen.');
    let saved;
    if (isNew) { const { data, error } = await db('customers').insert(d).select().single(); if (error) throw error; saved = data; }
    else { const { data, error } = await db('customers').update(d).eq('id', c.id).select().single(); if (error) throw error; saved = data; }
    closeSheet(el); await loadAll(); onSaved?.(saved); toast('Kunde gespeichert');
  });
  bind(el, 'del', async () => {
    if (!confirm(`${c.name} löschen? Bereits ausgestellte Rechnungen bleiben erhalten.`)) return;
    const { error } = await db('customers').delete().eq('id', c.id);
    if (error) throw new Error(/foreign key|violates/i.test(error.message) ? 'Zu diesem Kunden gibt es noch ein Abo. Lösche zuerst das Abo.' : error.message);
    closeSheet(el); await loadAll(); toast('Kunde gelöscht');
  });
  setTimeout(() => isNew && $('[name=name]', el).focus(), 250);
}

function backfillChoice(n, nextFuture, apply) {
  const el = openSheet('Startdatum liegt in der Vergangenheit', `
    <p style="margin:0 0 16px">Bis heute fallen <b>${n} ${n === 1 ? 'Abrechnungszeitraum' : 'Abrechnungszeiträume'}</b> an. Wie sollen sie erfasst werden? <span class="mini">Es geht dabei keine E-Mail an den Kunden.</span></p>
    <div class="actions">
      <button class="btn" data-x="paid">${n} Rechnungen als bezahlt nachtragen</button>
      <button class="btn ghost" data-x="open">${n} Rechnungen als offen nachtragen</button>
      <button class="btn ghost" data-x="skip">Nichts nachtragen – erste Rechnung am ${fmtDate(nextFuture)}</button>
    </div>
    <p class="mini" style="margin:0">Nachgetragene Rechnungen bekommen jeweils den ersten Werktag ihres Zeitraums als Rechnungsdatum.</p>`);
  for (const mode of ['paid', 'open', 'skip']) bind(el, mode, async () => { closeSheet(el); await apply(mode); });
}

function firstOfNextMonth() { const [y, m] = todayISO().split('-').map(Number); return new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 10); }

function recurringEditor(r) {
  const isNew = !r;
  r = r || { items: [{ quantity: 1, unit: 'Monat', vat: 19 }], interval: 'monthly', next_date: firstOfNextMonth(), auto_send: true, active: true };
  const el = openSheet(isNew ? 'Neues Abo' : 'Abo bearbeiten', `
    <label>Kunde<div class="inline"><select name="customer_id">${custOptions(r.customer_id)}</select><button type="button" class="btn ghost sm" data-x="newcust">+ Neu</button></div></label>
    <label>Bezeichnung (optional, erscheint auf der Rechnung)<input name="title" value="${esc(r.title)}" placeholder="z. B. Hosting & Betreuung"></label>
    <div class="grid2">
      <label>Rhythmus<select name="interval">${Object.entries(INTERVALS).map(([k, l]) => `<option value="${k}" ${r.interval === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label>Nächste Rechnung am<input name="next_date" type="date" value="${esc(r.next_date)}" min="${HISTORY_START}"></label>
    </div>
    <h3 class="sub">Positionen je Rechnung</h3>
    ${itemsEditor(r.items)}
    <label class="check"><input type="checkbox" name="auto_send" ${r.auto_send ? 'checked' : ''}>Rechnung automatisch an den Kunden senden</label>
    <label class="check"><input type="checkbox" name="active" ${r.active ? 'checked' : ''}>Abo aktiv</label>
    <p class="mini">Als Leistungszeitraum steht auf der Rechnung automatisch der jeweilige Abrechnungszeitraum, z. B. 01.11.2026 – 30.11.2026.</p>`,
    `${isNew ? '' : '<button class="btn ghost danger" data-x="del">Löschen</button><button class="btn ghost" data-x="now">Jetzt Rechnung erzeugen</button>'}<button class="btn" data-x="save">Speichern</button>`);
  wireItems(el);
  const collect = () => ({
    customer_id: $('[name=customer_id]', el).value || null, title: $('[name=title]', el).value.trim() || null,
    interval: $('[name=interval]', el).value, next_date: $('[name=next_date]', el).value, items: readItems(el),
    auto_send: $('[name=auto_send]', el).checked, active: $('[name=active]', el).checked,
  });
  const save = async () => {
    const d = collect();
    if (!d.customer_id) throw new Error('Bitte einen Kunden wählen.');
    if (!d.items.length) throw new Error('Bitte mindestens eine Position eintragen.');
    if (!d.next_date) throw new Error('Bitte ein Datum für die nächste Rechnung wählen.');
    if (d.auto_send && !customerById(d.customer_id)?.email) throw new Error('Für automatischen Versand braucht der Kunde eine E-Mail-Adresse.');
    if (isNew) { const { data, error } = await db('recurring').insert(d).select().single(); if (error) throw error; r.id = data.id; }
    else { const { error } = await db('recurring').update(d).eq('id', r.id); if (error) throw error; }
  };
  bind(el, 'save', async () => {
    const d = collect();
    if (d.next_date && d.next_date < HISTORY_START) throw new Error('Abos können höchstens bis 01.01.2024 zurückreichen.');
    if (d.next_date && d.next_date <= todayISO() && d.active) {
      // Startdatum liegt in der Vergangenheit: erst entscheiden, wie die vergangenen Zeiträume behandelt werden
      let n = 0, x = d.next_date; while (x <= todayISO() && n < 120) { n++; x = addMonthsISO(x, STEP_M[d.interval] || 1); }
      return backfillChoice(n, x, async mode => {
        if (mode === 'skip') { $('[name=next_date]', el).value = x; await save(); }
        else { await save(); const res = await callAct('recurring_backfill', { id: r.id, mode }); if (res.queued) toast(QUEUED_MSG); else toast(`${res.created.length} Rechnungen nachgetragen (${res.created[0]} … ${res.created[res.created.length - 1]})`); }
        closeSheet(el); await loadAll();
        if (mode === 'skip') toast(`Abo gespeichert – erste Rechnung am ${fmtDate(x)}`);
      });
    }
    await save(); closeSheet(el); await loadAll(); toast('Abo gespeichert');
  });
  bind(el, 'now', async () => {
    if (!confirm('Jetzt die Rechnung für den nächsten Zeitraum erzeugen' + ($('[name=auto_send]', el).checked ? ' und versenden' : '') + '?')) return;
    await save(); const res = await callAct('run_recurring', { id: r.id });
    closeSheet(el); await loadAll(); toast(res.queued ? QUEUED_MSG : `Rechnung ${res.invoice.number} erstellt${res.mail ? ' und versendet' : ''}`);
  });
  bind(el, 'del', async () => { if (!confirm('Abo löschen? Bereits erstellte Rechnungen bleiben erhalten.')) return; const { error } = await db('recurring').delete().eq('id', r.id); if (error) throw error; closeSheet(el); await loadAll(); toast('Abo gelöscht'); });
  bind(el, 'newcust', () => customerEditor(null, c => { $('[name=customer_id]', el).innerHTML = custOptions(c.id); }));
}

function drawProductsSettings() {

    : '<p class="mini" style="margin:0 0 12px">Noch keine Standard-Positionen.</p>';
  $$('[data-edit-product]', box).forEach(b => b.onclick = () => productEditor(state.products.find(x => x.id === b.dataset.editProduct), drawProductsSettings));
}
function wireSettings() {
  drawProductsSettings();
  $('[data-add-product]').onclick = () => productEditor(null, drawProductsSettings);
  const read = () => {
    const out = { ...S() };
    $$('[data-s]').forEach(i => { const k = i.dataset.s; out[k] = i.type === 'checkbox' ? i.checked : i.value.trim(); });
    for (const k of ['payment_days', 'reminder_interval', 'max_reminders', 'quote_valid_days']) out[k] = Math.max(0, parseInt(out[k], 10) || 0);
    out.number_digits = Math.min(Math.max(parseInt(out.number_digits, 10) || 4, 1), 8);
    out.number_start = Math.max(1, parseInt(out.number_start, 10) || 1);
    if (out.iban) out.iban = out.iban.replace(/\s+/g, '').toUpperCase();
    if (out.bic) out.bic = out.bic.replace(/\s+/g, '').toUpperCase();
    out.logo = logo || '';
    return out;
  };
  let logo = S().logo || '';
  const preview = () => {
    const o = read(); const y = todayISO().slice(0, 4);
    const nr = String(o.number_start).padStart(o.number_digits, '0');
    const p = String(o.prefix || '');
    const per = isOn(o.number_per_customer);
    $('[data-global-num]').hidden = per; $('[data-cust-num-hint]').hidden = !per;
    if (per) { const sep = p && !/[-_/]$/.test(p) ? '-' : ''; const c0 = state.customers.find(c => c.number) || { number: '10002' }; $('[data-num-preview]').textContent = `${p}${sep}${c0.number}-${String(Math.max((+c0.invoice_counter || 0) + 1, +c0.invoice_start || 1)).padStart(o.number_digits, '0')} (Beispiel ${c0.name || 'Kunde'})`; return; }
    $('[data-num-preview]').textContent = isOn(o.number_year) ? `${p}${p && !/[-_/]$/.test(p) ? '-' : ''}${y}-${String(1).padStart(o.number_digits, '0')} (bzw. ab ${nr}, falls höher)` : `${p}${nr} (oder höher, falls schon weiter)`;
  };
  $$('[data-s="prefix"],[data-s="number_digits"],[data-s="number_start"],[data-s="number_year"]').forEach(i => i.addEventListener('input', preview));
  $('[data-s="number_year"]').addEventListener('change', preview);
  $('[data-s="number_per_customer"]').addEventListener('change', preview);
  preview();
  const fileIn = $('[data-logo-file]');
  fileIn.onchange = async () => {
    const file = fileIn.files[0]; if (!file) return;
    try {
      const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Bild konnte nicht gelesen werden.')); i.src = url; });
      // Leere bzw. weiße Ränder automatisch abschneiden, dann auf sinnvolle Größe bringen
      const src = document.createElement('canvas'); src.width = img.naturalWidth; src.height = img.naturalHeight;
      const sx = src.getContext('2d'); sx.drawImage(img, 0, 0);
      const { data, width: w, height: h } = sx.getImageData(0, 0, src.width, src.height);
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
        const i = (yy * w + xx) * 4;
        const empty = data[i + 3] < 16 || (data[i] > 244 && data[i + 1] > 244 && data[i + 2] > 244);
        if (!empty) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; }
      }
      if (x1 < 0) { x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }
      const padPx = Math.round(Math.max(x1 - x0, y1 - y0) * 0.02);
      x0 = Math.max(0, x0 - padPx); y0 = Math.max(0, y0 - padPx); x1 = Math.min(w - 1, x1 + padPx); y1 = Math.min(h - 1, y1 + padPx);
      const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
      const sc = Math.min(1, 1600 / cw, 600 / ch);
      const cv = document.createElement('canvas'); cv.width = Math.round(cw * sc); cv.height = Math.round(ch * sc);
      const cx2 = cv.getContext('2d'); cx2.imageSmoothingQuality = 'high';
      cx2.drawImage(src, x0, y0, cw, ch, 0, 0, cv.width, cv.height);
      logo = cv.toDataURL('image/png');
      if (logo.length > 900000) logo = cv.toDataURL('image/jpeg', 0.92);
      $('[data-logo-prev]').innerHTML = `<img src="${logo}" alt="Logo">`;
      $('[data-logo-remove]').hidden = false;
      toast('Logo übernommen – zum Speichern unten auf „Einstellungen speichern“ tippen');
    } catch (e) { toast(e.message, true); }
  };
  const brandBtn = $('[data-logo-brand]');
  brandBtn.onclick = () => run(brandBtn, async () => {
    const blob = await (await fetch('brand/logo-rechnung.png')).blob();
    logo = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
    $('[data-logo-prev]').innerHTML = `<img src="${logo}" alt="Logo">`;
    $('[data-logo-remove]').hidden = false;
    await save(); toast('Medialyte-Logo übernommen und gespeichert');
  });
  $('[data-logo-remove]').onclick = () => { logo = ''; $('[data-logo-prev]').innerHTML = '<span class="mini">Kein Logo</span>'; $('[data-logo-remove]').hidden = true; };
  const save = async () => {
    const company = read();
    const { error } = await db('settings').upsert({ user_id: state.session.user.id, company, updated_at: new Date().toISOString() });
    if (error) throw error;
    state.settings = company; cacheSave();
  };
  const b = $('[data-save-settings]'); b.onclick = () => run(b, async () => { await save(); toast('Einstellungen gespeichert'); });
  const t = $('[data-test-mail]'); t.onclick = () => run(t, async () => { await save(); needsNet('Die Test-Mail'); const r = await callFn('test_mail'); toast(`Test-Mail an ${r.to} gesendet`); });
  $('[data-reset-tpl]').onclick = () => { $$('[data-s^="tpl_"]').forEach(i => { i.value = DEFAULTS[i.dataset.s]; }); toast('Zurückgesetzt – zum Übernehmen speichern'); };
  $('[data-logout]').onclick = async () => { if (!confirm(outbox.length ? `Achtung: ${outbox.length} Änderungen sind noch nicht in der Cloud. Sie bleiben auf dem Gerät und werden nach der nächsten Anmeldung übertragen.\n\nTrotzdem abmelden?` : 'Abmelden?')) return; try { localStorage.removeItem(CACHE_KEY); } catch {} await sb.auth.signOut(); };
}

function storedSession() {
  try { const k = Object.keys(localStorage).find(x => /^sb-.*-auth-token$/.test(x)); const v = k && JSON.parse(localStorage.getItem(k)); return v?.user ? v : null; } catch { return null; }
}

// ---------- Start ----------
async function start() {
  if (!configured) return render();
  const { data, error } = await sb.auth.getSession();
  state.session = data.session;
  // Offline mit abgelaufenem Zugangsschlüssel: angemeldet bleiben, Supabase erneuert ihn, sobald Internet da ist
  if (!state.session && (isNetErr(error) || !online())) state.session = storedSession();
  if (state.session) { if (cacheLoad()) state.loaded = true; render(); loadAll(); } else render();
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION') return;
    const had = !!state.session; state.session = session;
    if (session && !had) { if (cacheLoad()) state.loaded = true; render(); setTimeout(loadAll, 0); }
    else if (!session && had) { state.loaded = false; render(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.session) { if ($('.sheet-wrap')) flush(); else loadAll(); } });
  window.addEventListener('online', () => { state.offline = false; updateSyncUi(); if (!state.session) return; if ($('.sheet-wrap')) flush(); else loadAll(); checkAppUpdate(); });
  window.addEventListener('offline', () => { state.offline = true; updateSyncUi(); });
  setInterval(() => { if (outbox.length && online() && state.session) flush().then(n => n && !$('.sheet-wrap') && loadAll()); }, 60000);
  if (NATIVE) {
    const { App } = window.Capacitor.Plugins;
    // Zurück-Taste: offenes Fenster schließen, sonst App in den Hintergrund
    App?.addListener('backButton', () => { const s = $$('.sheet-wrap'); if (s.length) closeSheet(s[s.length - 1]); else App.minimizeApp(); });
    document.documentElement.classList.add('native');
    setTimeout(checkAppUpdate, 4000);
  }
}
start();

if (!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
