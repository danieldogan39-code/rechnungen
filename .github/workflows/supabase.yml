# Spielt Änderungen an Datenbank und Cloud-Funktion automatisch in Supabase ein.
# Benötigt einmalig das Repository-Secret SUPABASE_ACCESS_TOKEN.
name: Supabase aktualisieren

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bddogrluopqgeqvqzqmy
    steps:
      - uses: actions/checkout@v4

      - name: Zugang prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt (Repo → Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Datenbank-Updates einspielen
        run: |
          for f in supabase/migrations/*.sql; do
            echo "→ $f"
            jq -Rs '{query: .}' "$f" > /tmp/q.json
            code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data @/tmp/q.json)
            cat /tmp/out.txt; echo
            if [ "$code" -ge 300 ]; then echo "::error::$f fehlgeschlagen (HTTP $code)"; exit 1; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Cloud-Funktion veröffentlichen
        run: supabase functions deploy rechnungen --project-ref "$PROJECT_REF" --no-verify-jwt
